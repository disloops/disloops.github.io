# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

name: "disloops"
title: "disloops"
email: "disloops@gmail.com"
url: "https://disloops.com"
description: "sysadmin and security"
baseurl: "" # the subpath of your site, e.g. /blog
twitter_username: disloops
github_username:  disloops

# Site Author
author:
  name             : "matt"
  avatar           : # path of avatar image, e.g. "/assets/images/bio-photo.jpg"
  bio              : "sysadmin and security"
  location         : # City, State, Country
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:disloops@gmail.com"
    - label: "Website"
      icon: "fas fa-fw fa-link"
      url: "https://disloops.com"

# Site Footer
footer:
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:disloops@gmail.com"

# Site Navigation
masthead_title          : "" # overrides the website title displayed in the masthead, use " " for no title
masthead_title_font_size: "1.5rem"
logo                    : ""
logo_text               : ""



plugins:
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-remote-theme
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate

# Collections configuration
collections:
  pages:
    output: true
    permalink: /:name/

# MW - 1/5/25
# Taken from https://mmistakes.github.io/minimal-mistakes/docs/quick-start-guide/
remote_theme: "mmistakes/minimal-mistakes@4.26.2"

# Taken from https://mmistakes.github.io/minimal-mistakes/docs/configuration/
minimal_mistakes_skin: "dark" # "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise"
locale: "en-US"
repository: "disloops/disloops.github.io"


# Sidebar configuration - using theme's built-in sidebar
sidebar:
  main:
    - title: "All Posts"
      type: custom
      custom_include: sidebar-posts

# Taken from https://jekyllrb.com/docs/configuration/front-matter-defaults/
defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "no-header-title"
      author: "matt"
      author_profile: true
      show_date: false
      enable_copy_code_button: true
      comments: false
      excerpt_separator: "<!--more-->"
      show_excerpts: false
      description: "sysadmin and security"

      header:
        image: /assets/images/header.jpg
        overlay_image: /assets/images/header.jpg
        overlay_filter: 0.2
        image_description: "Header image"
  -
    scope:
      path: ""
      type: "pages"
    values:
      layout: "no-header-title"
      author: "matt"
      author_profile: true
      description: "sysadmin and security"
      header:
        image: /assets/images/header.jpg
        overlay_image: /assets/images/header.jpg
        overlay_filter: 0.2
        image_description: "Header image"

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Pagination (GitHub Pages compatible)
paginate: 10
paginate_path: "page/:num/"

# SEO
title_separator: "|"
twitter:
  username: disloops
  card: summary_large_image
facebook:
  app_id: ""
  publisher: ""
  admins: ""
open_graph:
  locale: en_US
  type: website
  title: "disloops"
  description: "sysadmin and security"
  url: "https://disloops.com"
  site_name: "disloops"
  images:
    - path: "/assets/images/header.jpg"
      height: "630"
      width: "1200"

